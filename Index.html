<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cartón de Bingo</title>
  <style>
    :root {
      --blue-main: #0c3875;       /* Azul intenso para bordes y casillas vacías */
      --blue-number: #0a2d5e;     /* Azul intenso para los textos de números */
      --cell-bg: #f8fafc;         /* Fondo casillas con número */
      --cell-marked: #fef08a;     /* Amarillo suave al marcar */
      --cell-marked-border: #eab308;
      --bg-page: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Cartón */
    .card-wrapper {
      width: 100%;
      background-color: #ffffff;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 3px solid var(--blue-main);
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      aspect-ratio: 9 / 3.4;
      background-color: var(--blue-main);
      padding: 4px;
      border-radius: 6px;
    }

    /* Casillas */
    .cell {
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1rem, 4.5vw, 1.6rem);
      font-weight: 800;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    /* Casilla vacía (azul intenso) */
    .cell.empty {
      background-color: var(--blue-main);
    }

    /* Casilla con número */
    .cell.has-number {
      background-color: var(--cell-bg);
      color: var(--blue-number);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    }

    .cell.has-number:active {
      transform: scale(0.94);
    }

    /* Casilla marcada / iluminada */
    .cell.marked {
      background-color: var(--cell-marked) !important;
      color: #713f12;
      position: relative;
    }

    .cell.marked::after {
      content: "";
      position: absolute;
      width: 70%;
      height: 70%;
      border: 3px solid rgba(202, 138, 4, 0.5);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Contenedor del botón inferior */
    .controls {
      margin-top: 10px;
    }

    .btn-new-card {
      background-color: var(--blue-main);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(12, 56, 117, 0.25);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-new-card:active {
      transform: scale(0.96);
      background-color: #072249;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-wrapper">
      <div id="bingoGrid" class="bingo-grid"></div>
    </div>

    <div class="controls">
      <button id="btnNewCard" class="btn-new-card">Nuevo cartón</button>
    </div>
  </div>

  <script>
    // Generador de números según rango de columna (0: 1-9, 1: 10-19, ..., 8: 80-90)
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function getColumnRange(colIndex) {
      if (colIndex === 0) return { min: 1, max: 9 };
      if (colIndex === 8) return { min: 80, max: 90 };
      return { min: colIndex * 10, max: colIndex * 10 + 9 };
    }

    // Genera la máscara del cartón (3x9 booleana con 5 números/fila y 1 o 2 por columna)
    function generateCardPattern() {
      while (true) {
        // Matriz vacía 3x9
        let matrix = [
          Array(9).fill(false),
          Array(9).fill(false),
          Array(9).fill(false)
        ];

        // 6 columnas tendrán 2 números y 3 columnas tendrán 1 número
        let colCounts = Array(9).fill(1);
        let doubleCols = [];
        while (doubleCols.length < 6) {
          let r = Math.floor(Math.random() * 9);
          if (!doubleCols.includes(r)) doubleCols.push(r);
        }
        doubleCols.forEach(c => colCounts[c] = 2);

        // Reparto inicial por columnas respetando cantidades
        let rowCounts = [0, 0, 0];
        let validAssignment = true;

        for (let c = 0; c < 9; c++) {
          if (colCounts[c] === 2) {
            let availableRows = [0, 1, 2].sort(() => Math.random() - 0.5);
            matrix[availableRows[0]][c] = true;
            matrix[availableRows[1]][c] = true;
            rowCounts[availableRows[0]]++;
            rowCounts[availableRows[1]]++;
          } else {
            let availableRows = [0, 1, 2].sort(() => Math.random() - 0.5);
            matrix[availableRows[0]][c] = true;
            rowCounts[availableRows[0]]++;
          }
        }

        // Si casualmente cada fila tiene 5 números, es un patrón perfecto
        if (rowCounts[0] === 5 && rowCounts[1] === 5 && rowCounts[2] === 5) {
          return matrix;
        }
      }
    }

    // Rellena la máscara con números aleatorios únicos por decena y ordenados ascendentemente
    function generateBingoCard() {
      const pattern = generateCardPattern();
      const card = [
        Array(9).fill(null),
        Array(9).fill(null),
        Array(9).fill(null)
      ];

      for (let c = 0; c < 9; c++) {
        const { min, max } = getColumnRange(c);
        const rowsWithNumber = [];
        for (let r = 0; r < 3; r++) {
          if (pattern[r][c]) rowsWithNumber.push(r);
        }

        const count = rowsWithNumber.length;
        const selectedNumbers = [];

        while (selectedNumbers.length < count) {
          let num = getRandomInt(min, max);
          if (!selectedNumbers.includes(num)) {
            selectedNumbers.push(num);
          }
        }

        // Orden ascendente en la columna
        selectedNumbers.sort((a, b) => a - b);

        rowsWithNumber.forEach((r, idx) => {
          card[r][c] = selectedNumbers[idx];
        });
      }

      return card;
    }

    // Renderizar en el DOM
    function renderCard() {
      const grid = document.getElementById('bingoGrid');
      grid.innerHTML = '';
      const cardData = generateBingoCard();

      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          const value = cardData[r][c];

          if (value === null) {
            cell.className = 'cell empty';
          } else {
            cell.className = 'cell has-number';
            cell.textContent = value;

            // Evento para alternar iluminación / tacha
            cell.addEventListener('click', () => {
              cell.classList.toggle('marked');
            });
          }

          grid.appendChild(cell);
        }
      }
    }

    // Inicialización y eventos
    document.getElementById('btnNewCard').addEventListener('click', renderCard);
    renderCard();
  </script>
</body>
</html>
